{% extends "base.html" %}

{% block content %}
<div style="max-width: 550px; margin: 0 auto; padding: 30px;">
    <div style="background:#fff0f5; border:1px solid #ffb6c1; border-radius:15px; padding:30px; text-align:center;">
        <h2 style="color:#ff1493; margin-top:0;">✅ Пароль успешно изменён</h2>

        <p style="color:#666; line-height:1.7;">
            Ваш новый пароль сохранён.
            Теперь вы можете войти в аккаунт с новым паролем.
        </p>

        <a href="{% url 'users:login' %}"
           style="display:inline-block; margin-top:20px; background:#ff1493; color:white; text-decoration:none; padding:12px 20px; border-radius:8px; font-weight:bold;">
            Войти в аккаунт 🎀
        </a>
    </div>
</div>
{% endblock %}
