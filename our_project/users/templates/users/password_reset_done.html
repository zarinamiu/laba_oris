{% extends "base.html" %}

{% block content %}
<div style="max-width: 550px; margin: 0 auto; padding: 30px;">
    <div style="background: #fff0f5; border: 1px solid #ffb6c1; border-radius: 15px; padding: 30px; text-align:center;">
        <h2 style="color:#ff1493; margin-top:0;">📩 Письмо отправлено</h2>

        <p style="color:#666; line-height:1.7;">
            Если аккаунт с таким email существует, мы отправили на него ссылку для сброса пароля.
        </p>

        <p style="color:#666; line-height:1.7;">
            Проверьте:
        </p>

        <ul style="text-align:left; display:inline-block; color:#555; line-height:1.8;">
            <li>входящие письма</li>
            <li>папку <strong>Спам</strong></li>
            <li>правильность введённого email</li>
        </ul>

        <p style="margin-top:20px;">
            <a href="{% url 'users:login' %}" style="color:#ff1493; text-decoration:none; font-weight:bold;">
                Вернуться на страницу входа
            </a>
        </p>
    </div>
</div>
{% endblock %}
